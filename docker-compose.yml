services:
  # Discord bot service — connects to Discord, captures voice, delivers transcripts
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: scribes-bot
    restart: unless-stopped
    secrets:
      - bot_token
    volumes:
      - scribes-data:/data
      - ./config.yaml:/data/config.yaml:ro
    environment:
      - CONFIG_PATH=/data/config.yaml
    networks:
      - scribes-net
    depends_on:
      transcriber:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/bot/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Transcriber service — polls for queued audio, runs sherpa-onnx
  transcriber:
    build:
      context: .
      dockerfile: transcriber/Dockerfile
    container_name: scribes-transcriber
    restart: unless-stopped
    volumes:
      - scribes-data:/data
      - ./config.yaml:/data/config.yaml:ro
    environment:
      - CONFIG_PATH=/data/config.yaml
    networks:
      - scribes-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
        reservations:
          memory: 2G

secrets:
  bot_token:
    file: ./secrets/bot_token

volumes:
  scribes-data:
    driver: local

networks:
  scribes-net:
    driver: bridge
